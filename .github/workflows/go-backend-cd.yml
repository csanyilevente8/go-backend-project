name: Go Backend CD

# Runs after "Go Backend CI" succeeds on main. Builds a linux/amd64 image,
# pushes it to Artifact Registry (repo image: go-backend) tagged with the commit
# SHA, then deploys it to the live release via Helm.
#
# The Go backend is the DEFAULT/live backend, so this workflow owns the backend
# deploy. It always pins backend.image.repository=go-backend so the release can
# never end up pointing the go-backend image at another repo's SHA. (The Spring
# backend-project CD only builds+pushes its own "backend" image for manual A/B
# swaps; it must NOT run helm upgrade — see that repo's backend-cd.yml.)
on:
  workflow_run:
    workflows: ["Go Backend CI"]
    types: [completed]
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  PROJECT: project-f0ad4dfa-b194-4dc6-963
  REGION: europe-central2
  AR_REPO: kubecourse
  IMAGE: go-backend
  CLUSTER: kubecourse
  ZONE: europe-central2-a
  NAMESPACE: todo
  RELEASE: todo
  OCI_CHART: oci://europe-central2-docker.pkg.dev/project-f0ad4dfa-b194-4dc6-963/kubecourse/charts/todo
  WIF_PROVIDER: projects/860228474942/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: github-deployer@project-f0ad4dfa-b194-4dc6-963.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Log Docker and Helm in to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" \
            | docker login -u oauth2accesstoken --password-stdin https://${REGION}-docker.pkg.dev
          echo "${{ steps.auth.outputs.access_token }}" \
            | helm registry login ${REGION}-docker.pkg.dev \
                --username oauth2accesstoken --password-stdin

      - name: Build and push image (linux/amd64, tagged with commit SHA)
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMG="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${IMAGE}:${SHA}"
          echo "Building $IMG"
          docker build --platform linux/amd64 -t "$IMG" .
          docker push "$IMG"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Deploy via Helm (latest published chart, new go-backend image)
        run: |
          SHA=$(git rev-parse --short HEAD)
          # No --version: pulls the latest published chart (floating).
          # --reset-then-reuse-values: adopt the latest chart's defaults but keep
          # the currently-deployed values (incl. the frontend image tag).
          # We pin BOTH backend.image.repository and .tag so the go-backend image
          # is always addressed by a go-backend SHA (guards against a stale
          # repository/tag pairing in the release).
          helm upgrade ${RELEASE} ${OCI_CHART} \
            --namespace ${NAMESPACE} \
            --reset-then-reuse-values \
            --set backend.image.repository=go-backend \
            --set backend.image.tag=${SHA} \
            --wait --timeout 180s
