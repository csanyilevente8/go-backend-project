name: Go Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      # GitHub-hosted Ubuntu runners include Docker, which the Testcontainers
      # integration test uses to start a real PostgreSQL instance.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
